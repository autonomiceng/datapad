[tools]
node = "24.19.0"
bun = "1.4.2"
"aqua:stripe/stripe-cli" = "1.53.0"
"aqua:rhysd/actionlint" = "1.7.12"
"github:editorconfig-checker/editorconfig-checker" = { version = "4.0.2", rename_exe = "editorconfig-checker" }
shellcheck = "0.11.0"
python = "3.13.14"
uv = "0.12.22"
"pipx:towncrier" = { version = "26.9.0", uvx = true, uvx_args = "--python 3.13.14 --no-python-downloads" }

[tasks.check]
description = "Check application code, API contract and repository conventions without rewriting sources"
depends = ["format:check", "check:editorconfig", "check:workflows", "check:scripts", "changelog:check", "app:check", "openapi:check", "check:architecture"]

[tasks."pr:check"]
description = "Run all current checks and tests before opening or updating a PR"
depends = ["check", "test"]

[tasks."format:check"]
description = "Check repository documentation and tooling configuration without rewriting them"
depends = ["deps:install"]
run = "./node_modules/.bin/vp fmt --config vite.config.ts --check '*.md' '.github/**/*.{md,yml}' 'changes/**/*.md' '.coderabbit.yaml' 'compose.yaml' package.json tsconfig.json .dependency-cruiser.cjs vite.config.ts drizzle.config.ts playwright.config.ts playwright.portal.config.ts playwright.billing.config.ts playwright.scheduled.config.ts 'index.html' 'src/**/*.{ts,tsx,css}' 'scripts/**/*.ts' 'tests/**/*.ts' 'docs/**/*.md' 'fixtures/**/*.json'"

[tasks."deps:install"]
description = "Install pinned project tools from the frozen Bun lockfile"
run = "bun install --frozen-lockfile"

[tasks."check:editorconfig"]
description = "Validate text files against EditorConfig"
run = "editorconfig-checker"

[tasks."check:workflows"]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."check:scripts"]
description = "Check the formatting, changelog and test tasks"
run = "shellcheck .mise/tasks/format .mise/tasks/test/format .mise/tasks/changelog/*"

[tasks.test]
description = "Run tooling safeguards and isolated application tests"
depends = ["test:format", "test:changelog", "test:app", "test:portal", "test:billing-proof", "test:stripe"]

[tasks."test:changelog"]
description = "Test fragment policy, comparison context and read-only previews"
run = "python -m unittest discover -s tests -p 'test_changelog.py' -v"

[tasks."app:check"]
description = "Lint and type-check application, tests and tooling through Vite+"
depends = ["deps:install"]
run = "./node_modules/.bin/vp check --no-fmt"

[tasks.build]
description = "Build the browser application and enforce server/browser separation"
depends = ["deps:install"]
run = "./node_modules/.bin/vp build"

[tasks."openapi:generate"]
description = "Update the versioned OpenAPI document from runtime schemas"
depends = ["deps:install"]
run = "bun scripts/openapi.ts"

[tasks."openapi:check"]
description = "Check that the committed API contract matches runtime schemas"
depends = ["deps:install"]
run = "bun scripts/openapi.ts --check"

[tasks."db:migrate"]
description = "Apply committed SQL migrations to explicit DATABASE_URL"
depends = ["deps:install"]
run = "bun scripts/migrate.ts"

[tasks."db:generate"]
description = "Generate a new migration after an intentional schema change"
depends = ["deps:install"]
run = "./node_modules/.bin/drizzle-kit generate"

[tasks."browser:install"]
description = "Install the pinned Chromium browser; CI also installs system libraries"
depends = ["deps:install"]
run = 'if [ "${CI:-}" = "true" ]; then mise run browser:deps; fi; ./node_modules/.bin/playwright install chromium'

[tasks."test:app"]
description = "Run application integration and browser cases against an isolated database"
depends = ["build", "browser:install"]
run = "bun scripts/local.ts test"

[tasks."test:server"]
description = "Run backend cases against an explicitly supplied TEST_DATABASE_URL"
depends = ["deps:install"]
run = "TZ=Asia/Tokyo bun test tests/server"

[tasks."test:portal"]
description = "Exercise authenticated customer accounts with an isolated database and local test inbox"
depends = ["build", "browser:install"]
run = "bun scripts/local.ts portal-test"

[tasks."portal:demo"]
description = "Run the authenticated synthetic portal and its local test inbox"
depends = ["build"]
run = "bun scripts/local.ts portal"

[tasks."portal:destroy"]
description = "Remove this inactive checkout's synthetic portal database"
depends = ["deps:install"]
run = "bun scripts/local.ts portal-destroy"

[tasks.demo]
description = "Run the built example locally with this checkout's persistent database"
depends = ["build"]
run = "bun scripts/local.ts demo"

[tasks.dev]
description = "Run the Vite development server and local Bun API"
depends = ["deps:install"]
run = "bun scripts/local.ts dev"

[tasks."demo:destroy"]
description = "Remove this inactive checkout's local database volume"
depends = ["deps:install"]
run = "bun scripts/local.ts destroy"

[tasks."browser:deps"]
description = "Install Chromium system libraries (requires administrator privileges on Linux)"
depends = ["deps:install"]
run = "./node_modules/.bin/playwright install-deps chromium"

[tasks."check:architecture"]
description = "Enforce application module ownership and verify forbidden imports fail"
depends = ["deps:install"]
run = "bun scripts/check-architecture.ts"

[tasks."import:file"]
description = "Import a shipped synthetic import file into an explicit DATABASE_URL"
depends = ["deps:install"]
run = "bun scripts/import-records.ts"

[tasks."billing:proof"]
description = "Run the explicit Stripe sandbox proof with private local evidence"
depends = ["deps:install"]
run = "bun scripts/billing-proof/cli.ts"

[tasks."test:billing-proof"]
description = "Check billing proof calendar, grouping and recovery without Stripe credentials"
depends = ["deps:install"]
run = "bun test tests/billing-proof"

[tasks."billing:serve"]
description = "Serve only the generated sandbox report, with no payment actions"
depends = ["deps:install"]
run = "bun scripts/billing-proof/report.ts"

[tasks."agents:stripe-skills"]
description = "Install current official Stripe guidance locally for Codex and Claude"
run = "npx --yes skills@1.7.0 add https://docs.stripe.com --skill stripe-best-practices upgrade-stripe --agent codex claude-code --yes"

[tasks."test:stripe"]
description = "Verify Stripe adapter boundaries without provider credentials"
depends = ["deps:install"]
run = "bun test tests/stripe"

[tasks."billing:demo"]
description = "Issue a synthetic manual-payment invoice and run the sandbox app with webhook forwarding"
depends = ["build"]
run = "bun scripts/local.ts billing"

[tasks."billing:refresh"]
description = "Reconcile the approved synthetic invoice using explicit sandbox runtime configuration"
depends = ["deps:install"]
run = "bun scripts/billing-operator.ts refresh"

[tasks."portal:billing"]
description = "Run the authenticated portal with explicitly configured Stripe sandbox invoices"
depends = ["build"]
run = "bun scripts/local.ts portal-billing"

[tasks."test:portal:billing"]
description = "Verify portal issue, hosted invoice and test payment reconciliation with explicit Stripe sandbox configuration"
depends = ["build", "browser:install"]
run = "bun scripts/local.ts portal-billing-test"

[tasks."test:portal:scheduled"]
description = "Verify scheduled sandbox invoice grouping and recovery with a private acceptance clock"
depends = ["build", "browser:install"]
run = "bun scripts/local.ts portal-scheduled-test"
