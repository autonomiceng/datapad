[tools]
node = "24.19.0"
bun = "1.4.2"
"aqua:rhysd/actionlint" = "1.7.12"
"github:editorconfig-checker/editorconfig-checker" = { version = "4.0.2", rename_exe = "editorconfig-checker" }
shellcheck = "0.11.0"
python = "3.13.14"
uv = "0.12.22"
"pipx:towncrier" = { version = "26.9.0", uvx = true, uvx_args = "--python 3.13.14 --no-python-downloads" }

[tasks.check]
description = "Check formatting, text conventions, task scripts, GitHub Actions and changelog policy without rewriting files"
depends = ["format:check", "check:editorconfig", "check:workflows", "check:scripts", "changelog:check"]

[tasks."pr:check"]
description = "Run all current checks and tests before opening or updating a PR"
depends = ["check", "test"]

[tasks."format:check"]
description = "Check repository documentation and tooling configuration without rewriting them"
depends = ["deps:install"]
run = "./node_modules/.bin/vp fmt --config vite.config.ts --check '*.md' '.github/**/*.{md,yml}' 'changes/**/*.md' '.coderabbit.yaml' 'package.json' 'vite.config.ts'"

[tasks."deps:install"]
description = "Install pinned project tools from the frozen Bun lockfile"
run = "bun install --frozen-lockfile"

[tasks."check:editorconfig"]
description = "Validate text files against EditorConfig"
run = "editorconfig-checker"

[tasks."check:workflows"]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."check:scripts"]
description = "Check the formatting, changelog and test tasks"
run = "shellcheck .mise/tasks/format .mise/tasks/test/format .mise/tasks/changelog/*"

[tasks.test]
description = "Test repository tooling safeguards; application tests arrive with application code"
depends = ["test:format", "test:changelog"]

[tasks."test:changelog"]
description = "Test fragment policy, comparison context and read-only previews"
run = "python -m unittest discover -s tests -p 'test_changelog.py' -v"
