services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: local-example-only
      POSTGRES_DB: example
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U example -d example"]
      interval: 1s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.4
    profiles: [portal]
    ports:
      - target: 1025
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 8025
        host_ip: 127.0.0.1
        protocol: tcp
volumes:
  database:
