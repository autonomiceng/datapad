# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: quiet
  request_changes_workflow: false
  poem: false
  sequence_diagrams: false
  pre_merge_checks:
    docstrings:
      mode: off
  path_instructions:
    - path: "**/*"
      instructions: >-
        Focus on concrete correctness failures, privacy or security exposure,
        data integrity, regressions and missing tests for changed behavior.
        Give a failure scenario and supporting evidence for each finding.
        Check the approved scope and reviewed architecture or module contracts;
        identify missing decisions rather than inventing interfaces.
        Apply the review expectations in AGENTS.md and CONTRIBUTING.md,
        including cleanup within the PR and interface hierarchy.
        Review public callable contracts for useful explanations of permissions,
        tenant scope, side effects, retry behavior and caller obligations.
        Local lint enforces scoped JSDoc presence; assess accuracy and usefulness
        without requiring comments on every internal helper or repeating types.
        Avoid formatter or style duplication and speculative abstractions.
        Public code, fixtures and documentation must remain reusable and free
        of private deployment details, credentials and production records.
  tools:
    # These checks already run in the required mise gate and CI.
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
